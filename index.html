<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ndocs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari&family=Mukta&family=Hind&family=Poppins&family=Roboto&family=Open+Sans&family=Lato&family=Montserrat&family=Merriweather&family=Playfair+Display&family=Inconsolata&family=Lora&family=Nunito&display=swap">
<style id="pgs"></style>
<style>
:root{--bg:#fff;--fg:#1f2328;--mut:#656d76;--line:#d0d7de;--head:#f3f4f6;--acc:#1a73e8;--sel:#e8f0fe;--desk:#eef0f3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--fg:#e6e8eb;--mut:#9aa1a9;--line:#3a3f46;--head:#23272d;--acc:#6ea8fe;--sel:#24324a;--desk:#0f1114}}
:root[data-theme="dark"]{--bg:#16181c;--fg:#e6e8eb;--mut:#9aa1a9;--line:#3a3f46;--head:#23272d;--acc:#6ea8fe;--sel:#24324a;--desk:#0f1114}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:14px system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:var(--fg)}
button,.btn{background:var(--head);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;display:inline-block;transition:border-color .15s,background .15s,transform .1s}
button:hover,.btn:hover{border-color:var(--acc)}button:active{transform:scale(.97)}
.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
#home{flex:1;overflow:auto}
.wrap{max-width:860px;margin:0 auto;padding:18px;box-sizing:border-box}
.wrap h1{margin:0 0 12px;font-size:22px}.wrap h3{margin:20px 0 8px;color:var(--mut);font-size:13px;text-transform:uppercase;letter-spacing:.04em}
.hb{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.hb input{flex:1;min-width:140px}
#tpl{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.tc{flex:none;width:112px;border:1px solid var(--line);border-radius:8px;cursor:pointer;overflow:hidden;transition:transform .15s,border-color .15s;text-align:center}
.tc:hover{border-color:var(--acc);transform:translateY(-2px)}
.tc div{height:80px;background:#fff;color:#999;font-size:30px;display:flex;align-items:center;justify-content:center}
.tc span{display:block;padding:6px;font-size:12px}
.card{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer;flex-wrap:wrap;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--acc);transform:translateY(-1px)}
.card .nm{flex:1;min-width:150px}.card b{display:block}.meta{color:var(--mut);font-size:12px}
.card input{width:160px}
#ed{display:none;flex:1;flex-direction:column;min-height:0}
#top{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#ti{flex:1;min-width:120px;font-weight:600;font-size:15px}
#sv{color:var(--mut);font-size:12px}
#tb,#ctx,#fr{display:flex;gap:4px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;background:var(--head)}
#tb>i{width:1px;height:20px;background:var(--line);flex:none;margin:0 2px}
#tb button{padding:4px 8px;min-width:30px;flex:none}#tb select{flex:none}
#tb input[type=color]{width:30px;height:28px;padding:0;flex:none}
#ctx,#fr{display:none}
#body{flex:1;display:flex;min-height:0}
#out{width:210px;border-right:1px solid var(--line);overflow:auto;padding:10px;flex:none;display:none}
#out.on{display:block}#out a{display:block;color:var(--fg);padding:3px 0;cursor:pointer;font-size:13px;text-decoration:none}#out a:hover{color:var(--acc)}
#out small{color:var(--mut)}
#sc{flex:1;overflow:auto;background:var(--desk);padding:20px 10px;scroll-behavior:smooth}
#page{background:#fff;color:#1f2328;margin:0 auto;box-shadow:0 1px 8px rgba(0,0,0,.25);outline:none;box-sizing:border-box;width:var(--w,794px);max-width:100%;min-height:var(--h,1123px);padding:72px;font:var(--fs,16px)/1.5 var(--ff,Arial,sans-serif);overflow-wrap:anywhere}
#page p,#page div{margin:0 0 8px}
#page h1{font-size:var(--h1,28px);margin:12px 0 8px}#page h2{font-size:var(--h2,22px);margin:10px 0 6px}#page h3{font-size:var(--h3,18px);margin:8px 0 6px}#page th{background:#f0f0f0;text-align:left}
#page blockquote{margin:8px 0;padding-left:12px;border-left:3px solid #bbb;color:#555}
#page table{border-collapse:collapse;width:100%;margin:8px 0}#page td,#page th{border:1px solid #999;padding:6px;min-width:40px;vertical-align:top}
#page img{max-width:100%}#page img.on{outline:2px solid var(--acc)}
#page a{color:#1a73e8}
#page hr.pb{border:0;border-top:2px dashed #bbb;margin:20px 0;break-after:page;page-break-after:always;position:relative}
#page hr.pb::after{content:"Page break";position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:#fff;color:#999;font-size:11px;padding:0 6px}
#page ul.chk{list-style:none;padding-left:4px}#page ul.chk li::before{content:"\2610  ";cursor:pointer}
#page ul.chk li.done::before{content:"\2611  "}#page ul.chk li.done{text-decoration:line-through;color:#888}
#stat{padding:4px 10px;border-top:1px solid var(--line);color:var(--mut);font-size:12px}
.focus #top,.focus #tb,.focus #ctx,.focus #fr,.focus #stat,.focus #out{display:none!important}
#fx{display:none;position:fixed;right:12px;top:12px;z-index:5}.focus #fx{display:block}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:9;animation:f .15s}
.ov.on{display:flex}@keyframes f{from{opacity:0}}
.ov>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;width:min(460px,92vw);max-height:90vh;overflow:auto;box-sizing:border-box}
.ov h3{margin:0 0 10px}.ov label{display:block;margin:8px 0 3px;color:var(--mut);font-size:12px}
.ov input:not([type=checkbox]),.ov select,.ov textarea{width:100%;box-sizing:border-box}
.ov .bs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}.ov .mb{display:block;width:100%;text-align:left;margin-bottom:6px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,20px);background:#222;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;pointer-events:none;transition:.25s;z-index:20}
#toast.on{opacity:1;transform:translate(-50%,0)}
.cm{background:#fff3a3;border-bottom:2px solid #f5c400;cursor:pointer}.tbx{border:1px solid #888;padding:8px;margin:8px 0;min-height:30px}.fnotes{border-top:1px solid #bbb;margin-top:24px;padding-top:6px;font-size:13px}
#cmt{width:240px;border-left:1px solid var(--line);overflow:auto;padding:10px;flex:none;display:none}#cmt.on{display:block}#cmt .ci{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;font-size:13px;cursor:pointer}
#sym{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}#sym button{padding:6px 0;font-size:18px;min-width:0}
#stat{display:flex;gap:10px;align-items:center}#stat select{padding:1px 4px}#fsz{width:58px;flex:none}#ctx input[type=color]{width:30px;height:26px;padding:0}#ctx button{padding:3px 8px}
@media(max-width:700px){#page{padding:20px!important}#cmt{display:none!important}}
@media print{#cmt,#home,#top,#tb,#ctx,#fr,#out,#stat,.ov,#fx,#toast{display:none!important}html,body{height:auto;display:block}#ed,#body,#sc{display:block!important;overflow:visible;padding:0;background:#fff}#page{box-shadow:none;margin:0;width:auto;max-width:none;min-height:0;padding:0!important}}
</style>
</head>
<body>
<div id="home"><div class="wrap">
  <h1>📄 Ndocs</h1>
  <div class="hb"><input id="hs" placeholder="Search documents"><button class="pri" id="newb">+ Blank document</button><label class="btn" for="imp">⬆ Import (.docx, .txt, .html)</label><input type="file" id="imp" accept=".docx,.txt,.html,.htm" hidden><button id="bk">Backup</button></div>
  <h3>Start with a template</h3><div id="tpl"></div>
  <h3>Your documents</h3><div id="list"></div>
</div></div>

<div id="ed">
  <div id="top"><button id="hm">← Home</button><input id="ti" placeholder="Document title"><span id="sv">Saved</span><button id="bf">Find</button><button id="bo">Outline</button><button id="bz">Focus</button><button id="bm">File ▾</button></div>
  <div id="tb">
    <button data-c="undo" title="Undo">↶</button><button data-c="redo" title="Redo">↷</button><i></i>
    <select id="blk"><option value="p">Normal</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="blockquote">Quote</option></select>
    <select id="fnt"><option>Arial</option><option>Georgia</option><option>Times New Roman</option><option>Courier New</option><option>Verdana</option><option>Trebuchet MS</option><option>Tahoma</option></select>
    <button id="fm" title="Smaller">−</button><input id="fsz" type="number" list="fl" value="16" min="6" max="300" step="0.5" title="Font size (type any number)"><button id="fp" title="Larger">+</button><datalist id="fl"><option>8<option>9<option>10<option>11<option>12<option>14<option>16<option>18<option>20<option>24<option>28<option>32<option>36<option>48<option>60<option>72<option>96</datalist><i></i>
    <button data-c="bold" title="Bold"><b>B</b></button><button data-c="italic" title="Italic"><em>I</em></button><button data-c="underline" title="Underline"><u>U</u></button><button data-c="strikeThrough" title="Strikethrough"><s>S</s></button><button data-c="superscript">x²</button><button data-c="subscript">x₂</button>
    <input type="color" id="fc" value="#000000" title="Text color"><input type="color" id="hc" value="#ffff00" title="Highlight"><i></i>
    <button data-c="justifyLeft" title="Align left">⬅</button><button data-c="justifyCenter" title="Center">↔</button><button data-c="justifyRight" title="Align right">➡</button><button data-c="justifyFull" title="Justify">☰</button>
    <select id="lh" title="Line spacing"><option value="">Spacing</option><option>1</option><option>1.15</option><option>1.5</option><option>2</option></select><i></i>
    <button data-c="insertUnorderedList" title="Bullets">• List</button><button data-c="insertOrderedList" title="Numbers">1. List</button><button id="ck" title="Checklist">☑</button><button id="ipf" title="Paragraph: spacing, indent, background, border">¶</button><button id="ipt" title="Format painter">🖌</button><button data-c="outdent">⇤</button><button data-c="indent">⇥</button><i></i>
    <button id="itb" title="Table">▦</button><button id="iim" title="Image">🖼</button><button id="ilk" title="Link">🔗</button><button id="ihr" title="Line">―</button><button id="ipb" title="Page break">⤓</button><button id="itc" title="Table of contents">☷</button><button id="itx" title="Text box">▭</button><button id="ish" title="Shapes">◇</button><button id="ich" title="Chart">📊</button><button id="isy" title="Symbols & emoji">Ω</button><button id="idt" title="Date & time">📅</button><button id="ifn" title="Footnote">fn</button><button id="icm" title="Comment">💬</button><button id="imc" title="Voice typing">🎤</button><button data-c="removeFormat" title="Clear formatting">⌫</button>
    <input type="file" id="img" accept="image/*" hidden>
  </div>
  <div id="ctx"></div>
  <div id="fr"><input id="fq" placeholder="Find"><input id="fr2" placeholder="Replace with"><button id="fn">Next</button><button id="frp">Replace</button><button id="fra">Replace all</button><button id="fcl">✕</button></div>
  <div id="body"><aside id="out"></aside><div id="sc"><div id="page" contenteditable="true" spellcheck="true"></div></div><aside id="cmt"></aside></div>
  <div id="stat"><span id="sw"></span><span style="flex:1"></span>Zoom <select id="zm"><option>50</option><option>75</option><option>90</option><option selected>100</option><option>125</option><option>150</option><option>200</option></select>%</div>
</div>
<button id="fx">Exit focus</button>
<div class="ov" id="md"><div><h3 id="mt"></h3><div id="mb"></div></div></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js"></script>
<script>
const K='ndocs.v1',$=id=>document.getElementById(id),page=$('page');
let DB={docs:[]};try{const d=JSON.parse(localStorage.getItem(K));if(d&&d.docs)DB=d}catch(e){}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let cur=null,rng=null,tm=null,img=null;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2600)}
function save(){try{localStorage.setItem(K,JSON.stringify(DB));$('sv').textContent='Saved'}catch(e){$('sv').textContent='Not saved';toast('Storage is full. Back up your documents and remove large images.')}}
const TPL={
Blank:'<p><br></p>',
Letter:'<p>[Your Name]<br>[Address]<br>[Phone · Email]</p><p>[Date]</p><p>To,<br>[Recipient Name]<br>[Company / Address]</p><p><b>Subject: [Subject]</b></p><p>Dear [Name],</p><p>[Write your letter here.]</p><p>Yours sincerely,<br>[Your Name]</p>',
Resume:'<h1>[Your Name]</h1><p>[City] · [Phone] · [Email]</p><h2>Summary</h2><p>[Two or three lines about you.]</p><h2>Experience</h2><p><b>[Job Title]</b>, [Company] <i>([Year] – [Year])</i></p><ul><li>[Achievement]</li><li>[Achievement]</li></ul><h2>Education</h2><p>[Degree], [Institution], [Year]</p><h2>Skills</h2><ul><li>[Skill]</li><li>[Skill]</li></ul>',
Invoice:'<h1>Invoice</h1><p>Invoice No: [#] &nbsp; Date: [Date]</p><p><b>Bill to:</b><br>[Client Name]<br>[Address]</p><table><tr><th>Item</th><th>Qty</th><th>Rate</th><th>Amount</th></tr><tr><td><br></td><td><br></td><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td><td><br></td><td><br></td></tr><tr><td colspan="3"><b>Total</b></td><td><br></td></tr></table><p>Payment details: [Bank / UPI]</p>',
Report:'<h1>[Report Title]</h1><p><i>[Author] · [Date]</i></p><h2>Summary</h2><p>[Key points.]</p><h2>Details</h2><p>[Write here.]</p><h2>Conclusion</h2><p>[Conclusion and next steps.]</p>',
'Meeting Notes':'<h1>Meeting Notes</h1><p>Date: [Date] &nbsp; Attendees: [Names]</p><h2>Agenda</h2><ul><li>[Topic]</li></ul><h2>Discussion</h2><p><br></p><h2>Action items</h2><ul class="chk"><li>[Task] – [Owner]</li></ul>'};
const SZ={A4:[794,1123],Letter:[816,1056],Legal:[816,1344]};

/* ---------- modal ---------- */
function modal(t,h){$('mt').textContent=t;$('mb').innerHTML=h;$('md').classList.add('on');return $('mb')}
const closeM=()=>$('md').classList.remove('on');
$('md').onclick=e=>{if(e.target===$('md'))closeM()};
function ask(t,fs,ok,cb){
  const b=modal(t,fs.map(f=>`<label>${f.l}</label>`+(f.o?`<select id="a_${f.k}">${f.o.map(o=>`<option${o==f.v?' selected':''}>${o}</option>`).join('')}</select>`:`<input id="a_${f.k}" type="${f.t||'text'}" value="${esc(f.v)}">`)).join('')+`<div class="bs"><button class="pri" id="a_ok">${ok}</button><button id="a_no">Cancel</button></div>`);
  b.querySelector('input,select').focus();
  $('a_no').onclick=closeM;$('a_ok').onclick=()=>{const v={};fs.forEach(f=>v[f.k]=$('a_'+f.k).value);closeM();cb(v)};
  b.onkeydown=e=>{if(e.key==='Enter')$('a_ok').click()}}

/* ---------- home ---------- */
function newDoc(name,html,title){const d={id:uid(),title:title||(name==='Blank'?'Untitled document':name),html:html!=null?html:TPL[name],updated:Date.now(),page:{size:'A4',o:'portrait',cols:1,m:72,bg:'#ffffff'},versions:[]};DB.docs.push(d);save();openDoc(d)}
function home(){
  if(cur){flush(true);cur=null}
  $('ed').style.display='none';$('home').style.display='block';
  $('tpl').innerHTML=Object.keys(TPL).map(n=>`<div class="tc" data-t="${esc(n)}"><div>${n==='Blank'?'+':'📄'}</div><span>${esc(n)}</span></div>`).join('');
  const q=$('hs').value.toLowerCase(),l=$('list');l.innerHTML='';
  const ds=[...DB.docs].filter(d=>!q||d.title.toLowerCase().includes(q)).sort((a,b)=>b.updated-a.updated);
  if(!ds.length)l.innerHTML='<p class="meta">No documents yet. Pick a template above to start.</p>';
  ds.forEach(d=>{
    const c=document.createElement('div');c.className='card';
    const tmp=document.createElement('div');tmp.innerHTML=d.html;const sn=(tmp.textContent||'').trim().slice(0,90);
    c.innerHTML=`<div class="nm"><b>${esc(d.title)}</b><span class="meta">${esc(sn)||'Empty document'}</span></div><span class="meta">${new Date(d.updated).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</span>`;
    const mk=(t,f)=>{const b=document.createElement('button');b.textContent=t;b.onclick=e=>{e.stopPropagation();f(b)};c.appendChild(b)};
    mk('Rename',()=>{const n=c.querySelector('.nm');const i=document.createElement('input');i.value=d.title;n.innerHTML='';n.appendChild(i);i.focus();i.select();i.onclick=e=>e.stopPropagation();i.onblur=()=>{d.title=i.value.trim()||d.title;save();home()};i.onkeydown=e=>{if(e.key==='Enter')i.blur()}});
    mk('Duplicate',()=>{DB.docs.push({...d,id:uid(),title:d.title+' (copy)',updated:Date.now(),versions:[]});save();home()});
    let arm=0;mk('Delete',b=>{if(!arm){arm=1;b.textContent='Click again to confirm';setTimeout(()=>{arm=0;b.textContent='Delete'},3000)}else{DB.docs=DB.docs.filter(x=>x!==d);save();home()}});
    c.onclick=()=>openDoc(d);l.appendChild(c)})
}
$('tpl').onclick=e=>{const t=e.target.closest('[data-t]');if(t)newDoc(t.dataset.t)};
$('newb').onclick=()=>newDoc('Blank');$('hs').oninput=home;

/* ---------- import / backup ---------- */
function clean(h){const t=document.createElement('template');t.innerHTML=h;t.content.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach(n=>n.remove());t.content.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name)}));return t.innerHTML}
$('imp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const nm=f.name.replace(/\.[^.]+$/,'');
  try{let h;
    if(/\.docx$/i.test(f.name)){if(!window.mammoth)return toast('Word import library failed to load. Check your internet.');h=(await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()})).value}
    else if(/\.html?$/i.test(f.name))h=clean(await f.text());
    else h=(await f.text()).split(/\n/).map(l=>`<p>${l?esc(l):'<br>'}</p>`).join('');
    newDoc('Blank',h,nm)}catch(er){toast('Could not read this file.')}};
$('bk').onclick=()=>{const b=modal('Backup / Restore','<p class="meta">Create a backup of all documents (JSON) and keep it safe. Restoring adds documents and keeps your existing ones.</p><textarea id="ta" rows="8"></textarea><div class="bs"><button id="b1">Create backup</button><button id="b2">Copy</button><button id="b3">Restore</button><button id="b4">Close</button></div>');
  $('b1').onclick=()=>{$('ta').value=JSON.stringify(DB)};
  $('b2').onclick=async()=>{$('ta').select();try{await navigator.clipboard.writeText($('ta').value)}catch(e){try{document.execCommand('copy')}catch(_){}}};
  $('b3').onclick=()=>{try{const d=JSON.parse($('ta').value);if(!Array.isArray(d.docs))throw 0;const have=new Set(DB.docs.map(x=>x.id));d.docs.forEach(x=>{if(x&&x.html!=null&&!have.has(x.id))DB.docs.push(x)});save();closeM();home()}catch(e){$('ta').value='Invalid backup data.'}};
  $('b4').onclick=closeM};

/* ---------- editor ---------- */
function applyPage(p){const[w,h]=SZ[p.size]||SZ.A4,L=p.o==='landscape';
  page.style.setProperty('--w',(L?h:w)+'px');page.style.setProperty('--h',(L?w:h)+'px');
  page.style.padding=p.m+'px';page.style.background=p.bg;page.style.columnCount=p.cols>1?p.cols:'auto';page.style.columnGap='32px';
  $('pgs').textContent=`@page{size:${p.size} ${p.o};margin:${p.m*.75}pt}`}
function openDoc(d){cur=d;$('home').style.display='none';$('ed').style.display='flex';page.innerHTML=d.html;$('ti').value=d.title;applyPage(d.page);upd();outline();$('sv').textContent='Saved';$('sc').scrollTop=0;
  if(innerWidth>900)$('out').classList.add('on');else $('out').classList.remove('on')}
function snap(){if(!cur)return;cur.html=page.innerHTML;if(cur.versions[0]&&cur.versions[0].html===cur.html)return;cur.versions.unshift({t:Date.now(),html:cur.html});cur.versions.length=Math.min(cur.versions.length,15)}
function flush(leave){cur.html=page.innerHTML;cur.title=$('ti').value.trim()||'Untitled document';cur.updated=Date.now();if(leave&&(!cur.versions[0]||Date.now()-cur.versions[0].t>600000))snap();save()}
function upd(){const t=page.innerText.trim();$('sw').textContent=(t?t.split(/\s+/).length:0)+' words · '+t.length+' characters'}

/* template gallery */
let tcat='All',tmore=false;
function tplRender(){const cats=['All',...Object.keys(TC)];
 $('tpl').innerHTML='<div class="cats">'+cats.map(c=>`<button class="${c===tcat?'on':''}" data-cat="${c}">${c}</button>`).join('')+'</div><div class="tg'+(tmore?'':' cl')+'">'+cats.slice(1).filter(c=>tcat==='All'||c===tcat).map(c=>TC[c].map(n=>`<div class="tc" data-t="${esc(n)}"><div>${n==='Blank'?'+':TI[c]}</div><span>${esc(n)}</span></div>`).join('')).join('')+'</div><button class="tmb" id="tmb">'+(tmore?'Show less ▲':'Show more ▼')+'</button>';requestAnimationFrame(()=>{const g=$('tpl').querySelector('.tg'),b=$('tmb');if(g&&b&&!tmore&&g.scrollHeight<=g.clientHeight+4)b.style.display='none'})}
$('tpl').addEventListener('click',e=>{const c=e.target.closest('[data-cat]');if(e.target.id==='tmb'){tmore=!tmore;tplRender();return}if(c){tcat=c.dataset.cat;tplRender()}});
const _home=home;home=function(){_home();tplRender()};
$('hm').onclick=()=>home();$('hs').oninput=()=>home();
home();
</script>
